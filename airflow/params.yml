# параметры дообучения DAG recsys_retrain: интервал выборки событий, веса
# событий, гиперпараметры моделей, пути в S3 и в MLflow.
# значения совпадают с ../params.yaml: секция als — это als_best оттуда
# (подобрана Optuna на этапе 3), остальное перенесено один в один

# датасет заморожен на сентябре 2015: верхняя граница интервала выборки
# не может быть позже этой даты, даже если data_interval_end у DAG больше.
# граница исключающая, как split_end в ../params.yaml
data_max_date: "2015-09-18"

train_window_days: 120   # глубина истории, которую читает extract_events
labels_days: 15          # окно таргета для ранжировщика
test_days: 15            # окно, на котором считаются метрики прогона

# сырой вес пары = сумма весов её событий, значение в матрице = log1p(вес)
event_weights:
  view: 1
  addtocart: 5
  transaction: 10

# подобраны Optuna на этапе 3, см. ../params.yaml -> als_best
als:
  factors: 128
  regularization: 0.008168455894760165
  iterations: 10

# ранжировщик второй стадии
catboost:
  iterations: 500
  learning_rate: 0.1
  depth: 6

# размер пула кандидатов: при обучении и оценке берём список подлиннее,
# на выкатке он короче — сервис отдаёт не больше 20 позиций
candidates:
  als_train: 100
  popular_train: 50
  als_serving: 50
  popular_serving: 20
  negatives_per_user: 30   # негативов на пользователя в обучающей выборке
  holdout_share: 0.2       # доля пользователей под раннюю остановку

top_k: 10            # глубина выдачи, на которой считаются метрики
n_candidates: 100    # длина сохраняемого списка топа популярных
n_similar: 10        # сколько похожих товаров считаем на товар
min_user_events: 2   # кому считаем персональные рекомендации на выкатке
recs_top_n: 20       # длина списка рекомендаций, который забирает сервис

# рекомендации на выкатке считаются пачками пользователей: пул кандидатов
# на всех сразу не помещается в память контейнера
serving_chunk_users: 50000

s3_prefix: recsys_final
mlflow_experiment: final_project_recsys
registry_model: recsys_ranker_model

# новая версия выкатывается, если её recall@10 не ниже 95 % от recall@10
# последней версии в Registry — защита от выкатки просевшей модели
degradation_tolerance: 0.95
