# параметры пайплайна: границы сплитов, веса событий, гиперпараметры моделей.
# верхняя граница каждого окна строгая (<), поэтому окна не пересекаются
# и событие на границе попадает ровно в одно из них

split_train_fit: "2015-05-03"   # начало истории Retailrocket
split_valid: "2015-08-04"       # начало валидации, на ней подбирается ALS
split_labels: "2015-08-19"      # начало окна таргета для ранжировщика
split_test: "2015-09-03"        # начало теста, единственное окно итоговых метрик
split_end: "2015-09-19"         # конец истории, последнее событие 2015-09-18

# сырой вес пары = сумма весов её событий, значение в матрице = log1p(вес)
event_weights:
  view: 1
  addtocart: 5
  transaction: 10

# стартовые гиперпараметры ALS (спринт 4), уточняются Optuna на валидации
als:
  factors: 64
  regularization: 0.05
  iterations: 20

# найдено Optuna по recall@10 на валидации, на них обучена финальная модель
als_best:
  factors: 128
  regularization: 0.008168455894760165
  iterations: 10

optuna:
  n_trials: 12

# размер пула кандидатов для второй стадии: при обучении и оценке берём
# список подлиннее, на выкатке он короче — сервис отдаёт не больше 20 позиций
candidates:
  als_train: 100
  popular_train: 50
  als_serving: 50
  popular_serving: 20
  negatives_per_user: 30   # негативов на пользователя в обучающей выборке
  holdout_share: 0.2       # доля пользователей под раннюю остановку

# ранжировщик второй стадии
catboost:
  iterations: 500
  learning_rate: 0.1
  depth: 6

top_k: 10            # глубина выдачи, на которой считаются метрики
n_candidates: 100    # длина сохраняемого списка топа популярных
n_similar: 10        # сколько похожих товаров считаем на товар
min_user_events: 2   # кому считаем персональные рекомендации на выкатке
recs_top_n: 20       # длина списка рекомендаций, который забирает сервис
seed: 42
